name: Hosted check

# Hourly synthetic check of the hosted demo (D10): scripts/check_hosted.sh plus GET /health/deep
# and one shopping-agent chat (CHECK_AI, so a spent model budget fails the run).
# A failed run emails whoever GitHub notifies for this workflow (Settings > Notifications >
# Actions: "Only notify for failed workflows"). Hourly keeps the private repo inside its free
# Actions minutes. Stops by itself after judging ends (Dec 15, 2026; services shut down Dec 16); disable it then:
# `gh workflow disable hosted-check.yml`.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_fail:
        description: "Fail on purpose, to test the failure email"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Services still up?
        id: window
        run: |
          if [[ "$(date -u +%F)" > "2026-12-15" ]]; then
            echo "The hosted demo was judged until 2026-12-15 and is shut down; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.window.outputs.skip != 'true'
      - name: Smoke check, deep health and AI
        if: steps.window.outputs.skip != 'true'
        env:
          HOSTED_BACKEND_URL: ${{ secrets.HOSTED_BACKEND_URL }}
          HOSTED_WEB_URL: ${{ secrets.HOSTED_WEB_URL }}
          BACKEND_API_TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
          CHECK_AI: "1"
        run: scripts/check_hosted.sh "$HOSTED_BACKEND_URL" "$HOSTED_WEB_URL"
      - name: Forced failure (manual test of the email)
        if: inputs.force_fail
        run: |
          echo "Failing on purpose (force_fail)."
          exit 1
