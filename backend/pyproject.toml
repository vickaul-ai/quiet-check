[project]
name = "quiet-check-backend"
version = "0.1.0"
description = "Quiet Check backend: risk agent, AP3 risk check, PayPal payments service, webhooks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ap3-functions==1.2.2",
    "ap3[a2a]==1.2.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4,<2",
    "langchain-anthropic>=1.7,<2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.2.4",
    "python-ulid>=3.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not live'"
markers = [
    "slow: demo-size timing run (opt-in: -m slow)",
    "live: real PayPal sandbox run; needs saved approved orders and ngrok (opt-in: -m live)",
]
