[project]
name = "quiet-check-backend"
version = "0.1.0"
description = "Quiet Check backend: risk agent, AP3 risk check, PayPal payments service, webhooks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
